name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check index.js
          node --check src/app.js
          node --check src/store.js
          node --check utils/validators.js

      - name: Unit and API tests
        run: npm test
