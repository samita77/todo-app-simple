services:
  todo-app:
    build: .
    image: todo-app:latest
    container_name: todo-app
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
